<script>
const S=[
{n:"बाल विकास एवं शिक्षाशास्त्र",qs:[
["एक शिक्षक बच्चों को अलग-अलग तरीकों से उत्तर देने का अवसर देता है। यह किस सिद्धांत को सबसे अधिक दर्शाता है?",["एकरूपता","बाल-केंद्रितता","दंड आधारित अनुशासन","केवल व्याख्यान"],1,"बाल-केंद्रित कक्षा में बच्चों की सक्रिय भागीदारी और विविध उत्तरों को महत्व दिया जाता है।"],
["पियाजे के अनुसार ठोस संक्रियात्मक अवस्था का प्रमुख गुण क्या है?",["अमूर्त तर्क ही संभव है","ठोस वस्तुओं पर तार्किक सोच विकसित होती है","भाषा का विकास रुक जाता है","बच्चा केवल अनुकरण करता है"],1,"इस अवस्था में बच्चा ठोस उदाहरणों पर तार्किक वर्गीकरण, क्रमबद्धता आदि कर सकता है।"],
["विगोत्स्की का 'निकटस्थ विकास क्षेत्र' किससे संबंधित है?",["बिना सहायता के सभी कार्य","सहायता से किए जा सकने वाले कार्यों का क्षेत्र","केवल शारीरिक विकास","परीक्षा अंक"],1,"ZPD वह अंतर है जो बच्चा अकेले और सक्षम सहायता से कर सकता है।"],
["यदि बच्चा बार-बार गलती कर रहा है, तो शिक्षक की पहली प्रतिक्रिया क्या होनी चाहिए?",["उसे दंड देना","गलती का कारण समझना और रणनीति बदलना","उसे कक्षा से बाहर भेजना","कार्य कम कर देना"],1,"त्रुटि सीखने की प्रक्रिया का संकेत हो सकती है; कारण समझना बेहतर शिक्षण की ओर ले जाता है।"],
["समावेशी शिक्षा का मुख्य उद्देश्य क्या है?",["सभी बच्चों को एक ही तरीके से पढ़ाना","विविध आवश्यकताओं वाले बच्चों को साथ सीखने के अवसर देना","केवल विशेष विद्यालय बनाना","केवल मेधावी बच्चों पर ध्यान देना"],1,"समावेशी शिक्षा भागीदारी, पहुँच और सीखने के अवसरों में बाधाएँ कम करती है।"],
["रचनात्मक मूल्यांकन का उपयोग मुख्यतः किसलिए किया जाता है?",["केवल अंतिम ग्रेड के लिए","सीखने के दौरान सुधार हेतु प्रतिक्रिया देने के लिए","प्रवेश परीक्षा के लिए","रैंक बनाने के लिए"],1,"Formative assessment शिक्षण के दौरान सीखने की स्थिति जानकर सुधार की दिशा देता है।"],
["एक बच्चा चित्रों से बेहतर सीखता है। शिक्षक को क्या करना चाहिए?",["चित्रों को हटाना","विविध प्रस्तुतीकरण विधियों का प्रयोग करना","केवल मौखिक व्याख्यान देना","बच्चे को अलग बैठाना"],1,"विभिन्न माध्यमों से प्रस्तुतीकरण बच्चों की विविध सीखने की जरूरतों को संबोधित कर सकता है।"],
["'बच्चे का विकास केवल वंशानुक्रम से निर्धारित है' कथन के बारे में सही विचार क्या है?",["पूरी तरह सही","विकास पर वंशानुक्रम और पर्यावरण दोनों का प्रभाव पड़ता है","केवल विद्यालय जिम्मेदार है","केवल उम्र जिम्मेदार है"],1,"विकास बहु-कारकीय है; जैविक और पर्यावरणीय दोनों कारक महत्वपूर्ण हैं।"],
["कक्षा में खुले प्रश्न पूछने का एक प्रमुख लाभ क्या है?",["सिर्फ हाँ/नहीं उत्तर","तर्क और विचार व्यक्त करने का अवसर","समय हमेशा कम करना","रटने को बढ़ाना"],1,"खुले प्रश्न बच्चों को कारण बताने, तुलना करने और अपने विचार बनाने का अवसर देते हैं।"],
["प्रेरणा बढ़ाने के लिए शिक्षक को किस प्रकार का लक्ष्य उपयोगी बनाना चाहिए?",["अस्पष्ट लक्ष्य","स्पष्ट और प्राप्त करने योग्य सीखने के लक्ष्य","केवल प्रतियोगिता","केवल दंड"],1,"स्पष्ट लक्ष्य बच्चे को यह समझने में मदद करते हैं कि उसे क्या सीखना है।"],
["बहुभाषी कक्षा में शिक्षक को क्या करना चाहिए?",["घर की भाषा को रोकना","बच्चों की भाषाओं को संसाधन की तरह उपयोग करना","केवल सबसे तेज बच्चे से बात करना","गलत उच्चारण पर दंड देना"],1,"बहुभाषिकता को संसाधन मानने से समझ और सहभागिता बढ़ सकती है।"],
["डिस्लेक्सिया वाले बच्चे के लिए उपयुक्त सहयोग क्या है?",["अधिक दंड","अतिरिक्त समय और बहु-संवेदी गतिविधियाँ","पढ़ने से पूरी छूट","उसे कम बुद्धिमान कहना"],1,"पढ़ने-संबंधी कठिनाई में संरचित, बहु-संवेदी और उपयुक्त सहयोग उपयोगी हो सकता है।"],
["सहपाठी सहयोग का उपयोग किस स्थिति में अधिक उपयुक्त है?",["जब बच्चों को चर्चा और सहयोग से सीखना हो","जब कोई संवाद न चाहिए","केवल परीक्षा के अंतिम मिनट में","केवल अनुशासन के लिए"],0,"Peer learning बच्चों को विचार साझा करने और एक-दूसरे से सीखने देता है।"],
["बच्चे के आत्म-सम्मान को बढ़ाने के लिए शिक्षक को किस प्रकार की प्रतिक्रिया देनी चाहिए?",["व्यक्ति पर टिप्पणी","प्रयास और रणनीति पर विशिष्ट प्रतिक्रिया","सार्वजनिक तुलना","व्यंग्य"],1,"विशिष्ट प्रक्रिया-केंद्रित प्रतिक्रिया बच्चे को सुधार की दिशा दिखाती है।"],
["कक्षा में 'स्कैफोल्डिंग' का अर्थ है:",["स्थायी सहायता","आवश्यकतानुसार अस्थायी सहायता देना और धीरे-धीरे हटाना","केवल गृहकार्य","सिर्फ परीक्षा लेना"],1,"Scaffolding में सहायता बच्चे की वर्तमान क्षमता के अनुसार दी जाती है और स्वायत्तता बढ़ने पर कम की जाती है।"],
["बच्चों की पूर्व अवधारणाएँ जानने का अच्छा तरीका क्या है?",["सीधे अध्याय समाप्त करना","पूर्व-प्रश्न, चर्चा या अवधारणा-मानचित्र","केवल उपस्थिति लेना","केवल अंतिम परीक्षा"],1,"पूर्वज्ञान जानने से शिक्षक नए ज्ञान को बच्चों की मौजूदा समझ से जोड़ सकता है।"],
["'सीखना अर्थ-निर्माण की प्रक्रिया है' कथन किस दृष्टिकोण से जुड़ा है?",["रचनावाद","केवल व्यवहारवाद","केवल परिपक्वतावाद","दंडवाद"],0,"रचनावादी दृष्टिकोण में शिक्षार्थी अनुभवों के आधार पर अर्थ का निर्माण करता है।"],
["एक बच्चा गणित में सही उत्तर देता है लेकिन तरीका नहीं बता पाता। शिक्षक को क्या करना चाहिए?",["केवल अंक देना","उससे सोच की प्रक्रिया समझाने को कहना","उत्तर गलत घोषित करना","अगला प्रश्न न देना"],1,"प्रक्रिया पूछने से शिक्षक बच्चे की वास्तविक समझ और रणनीति जान सकता है।"],
["सामाजिक-भावनात्मक सीखने में कौन-सा कौशल शामिल है?",["केवल गणना","भावनाओं की पहचान और संबंध प्रबंधन","केवल हस्तलेखन","केवल याद करना"],1,"SEL में आत्म-जागरूकता, संबंध कौशल और भावनाओं का प्रबंधन शामिल होते हैं।"],
["बच्चों में जिज्ञासा बढ़ाने के लिए कौन-सा तरीका उपयुक्त है?",["हर प्रश्न का तुरंत उत्तर देना","अन्वेषण और 'क्यों/कैसे' प्रश्नों को प्रोत्साहित करना","प्रश्न पूछने पर रोक","केवल पाठ पढ़ना"],1,"अन्वेषण आधारित गतिविधियाँ बच्चों को प्रश्न पूछने और प्रमाण खोजने के लिए प्रेरित करती हैं।"],
["कक्षा में धीमी गति से सीखने वाले बच्चे के लिए सबसे उपयुक्त दृष्टिकोण क्या है?",["उसे स्थायी रूप से अलग करना","कार्य को छोटे चरणों में बाँटकर समय और सहयोग देना","उसकी अपेक्षाएँ शून्य करना","उसे कभी प्रश्न न देना"],1,"छोटे चरण, स्पष्ट निर्देश और उपयुक्त समय सीखने की पहुँच बढ़ाते हैं।"],
["पोर्टफोलियो मूल्यांकन में क्या शामिल होता है?",["केवल एक परीक्षा","समय के साथ बच्चे के कार्यों का चयनित संग्रह","केवल उपस्थिति","केवल मौखिक प्रश्न"],1,"Portfolio से प्रगति, प्रयास और कार्य की गुणवत्ता को समय के साथ देखा जा सकता है।"],
["शिक्षक का 'wait time' बढ़ाने से क्या लाभ हो सकता है?",["सोचने का अवसर कम होता है","बच्चों को उत्तर सोचने का अधिक समय मिलता है","कक्षा हमेशा शांत रहती है","केवल शिक्षक बोलता है"],1,"उत्तर से पहले पर्याप्त समय देने पर अधिक बच्चे विचार कर पाते हैं।"],
["सहयोगात्मक अधिगम में शिक्षक की भूमिका क्या होनी चाहिए?",["हर उत्तर स्वयं देना","समूह प्रक्रिया को सुगम बनाना और आवश्यक सहायता देना","केवल अंक देना","समूहों को कभी न देखना"],1,"शिक्षक facilitator के रूप में लक्ष्य, संसाधन और feedback देता है।"],
["एक ही परीक्षा से हर बच्चे की क्षमता तय करना क्यों उचित नहीं है?",["क्योंकि परीक्षा कभी उपयोगी नहीं","क्षमताएँ बहुआयामी हैं और मूल्यांकन के अनेक अवसर चाहिए","क्योंकि अंक हमेशा गलत हैं","क्योंकि बच्चे परीक्षा नहीं दे सकते"],1,"विभिन्न साक्ष्यों से सीखने की अधिक व्यापक तस्वीर मिलती है।"],

let qs=[];S.forEach((s,si)=>s.qs.forEach(q=>qs.push({sec:s.n,q:q[0],o:q[1],a:q[2],e:q[3],si})));
let cur=0,ans=Array(qs.length).fill(null),review=Array(qs.length).fill(false),submitted=false,time=150*60;
const $=id=>document.getElementById(id);
function render(){
 if(submitted)return;
 const x=qs[cur];
 $("quiz").innerHTML='<div class="section">'+x.sec+'</div><div class="qno">प्रश्न '+(cur+1)+' / '+qs.length+'</div>'+
 '<div class="question">'+x.q+'</div><div class="opts">'+x.o.map((o,i)=>'<label class="opt '+(ans[cur]===i?'sel':'')+'"><input type="radio" name="opt" '+(ans[cur]===i?'checked':'')+' onchange="choose('+i+')"> <span><b>'+String.fromCharCode(65+i)+'.</b> '+o+'</span></label>').join('')+'</div>'+
 '<div class="actions"><button class="btn secondary" onclick="prev()">← पिछला</button><button class="btn warn" onclick="mark()">⚑ '+(review[cur]?'Review हटाएँ':'Mark for Review')+'</button><button class="btn secondary" onclick="clearAns()">उत्तर साफ करें</button><button class="btn primary" onclick="next()">'+(cur===qs.length-1?'अंतिम प्रश्न':'अगला →')+'</button></div>';
 updatePalette();
}
function choose(i){ans[cur]=i;render();}
function prev(){if(cur>0){cur--;render()}}
function next(){if(cur<qs.length-1){cur++;render()}else submitTest()}
function mark(){review[cur]=!review[cur];render()}
function clearAns(){ans[cur]=null;render()}
function updatePalette(){
 $("palette").innerHTML=qs.map((x,i)=>'<div class="p '+(ans[i]!==null?'answered ':'')+(review[i]?'review ':'')+(i===cur?'current':'')+'" onclick="gotoQ('+i+')">'+(i+1)+'</div>').join('');
 $("fill").style.width=(ans.filter(x=>x!==null).length/qs.length*100)+'%';
}
function gotoQ(i){if(!submitted){cur=i;render()}}
function submitTest(){
 if(submitted)return;
 if(!confirm('क्या आप टेस्ट सबमिट करना चाहते हैं?'))return;
 submitted=true;clearInterval(clock);
 let score=0;qs.forEach((x,i)=>{if(ans[i]===x.a)score++});
 let by=S.map((s,si)=>{let total=s.qs.length,correct=qs.filter((x,i)=>x.si===si&&ans[i]===x.a).length;return {n:s.n,total,correct}});
 $("quiz").innerHTML='';
 $("result").classList.remove('hidden');
 $("result").innerHTML='<h2>Mock Test 2 Result</h2><div class="score">'+score+' / '+qs.length+'</div><p><b>सही:</b> '+score+' &nbsp; <b>गलत:</b> '+ans.filter((a,i)=>a!==null&&a!==qs[i].a).length+' &nbsp; <b>छोड़े:</b> '+ans.filter(a=>a===null).length+'</p>'+
 '<h3>Section-wise Score</h3>'+by.map(b=>'<p><b>'+b.n+'</b> — '+b.correct+' / '+b.total+'</p>').join('')+
 '<hr><h3>उत्तर समीक्षा</h3>'+qs.map((x,i)=>'<div class="reviewBox"><b>Q'+(i+1)+'. '+x.q+'</b><div class="'+(ans[i]===x.a?'correct':'wrong')+'">आपका उत्तर: '+(ans[i]===null?'नहीं दिया':x.o[ans[i]])+' | सही उत्तर: '+x.o[x.a]+'</div><div class="explain">'+x.e+'</div></div>').join('')+
 '<div class="actions"><button class="btn primary" onclick="location.reload()">फिर से प्रयास करें</button></div>';
 window.scrollTo(0,0);
}
function tick(){time--;if(time<=0){time=0;submitTestForce()}let m=Math.floor(time/60),s=time%60;$("timer").textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function submitTestForce(){if(submitted)return;submitted=true;clearInterval(clock);let score=qs.reduce((n,x,i)=>n+(ans[i]===x.a?1:0),0);$("quiz").innerHTML='';$("result").classList.remove('hidden');$("result").innerHTML='<h2>समय समाप्त</h2><div class="score">'+score+' / '+qs.length+'</div><p>समय समाप्त होने के कारण टेस्ट स्वतः जमा किया गया।</p><button class="btn primary" onclick="location.reload()">फिर से प्रयास करें</button>';window.scrollTo(0,0)}
render();const clock=setInterval(tick,1000);
</script>
