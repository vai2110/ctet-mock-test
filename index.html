प्रश्न '+(cur+1)+' / 150</div><div class="question">'+x.q+'</div><div class="opts">'+x.o.map((o,i)=>'<label class="opt '+(ans[cur]===i?'sel':'')+'"><input type="radio" name="opt" '+(ans[cur]===i?'checked':'')+' onchange="choose('+i+')"><span><b>'+String.fromCharCode(65+i)+'.</b> '+o+'</span></label>').join('')+'</div><div class="actions"><button class="btn secondary" onclick="prev()">← पिछला</button><button class="btn warn" onclick="mark()">⚑ '+(review[cur]?'Review हटाएँ':'Mark for Review')+'</button><button class="btn secondary" onclick="clearAns()">उत्तर साफ करें</button><button class="btn primary" onclick="next()">'+(cur===149?'सबमिट करें':'अगला →')+'</button></div>';palette()}function choose(i){ans[cur]=i;render()}function prev(){if(cur>0){cur--;render()}}function next(){if(cur<149){cur++;render()}else submitTest()}function mark(){review[cur]=!review[cur];render()}function clearAns(){ans[cur]=null;render()}function gotoQ(i){cur=i;render()}function palette(){$("palette").innerHTML=qs.map((x,i)=>'<div class="p '+(ans[i]!==null?'answered ':'')+(review[i]?'review ':'')+(i===cur?'current':'')+'" onclick="gotoQ('+i+')">'+(i+1)+'</div>').join('');$("fill").style.width=(ans.filter(x=>x!==null).length/150*100)+'%'}function showResult(auto){if(submitted)return;submitted=true;clearInterval(clock);let score=qs.reduce((n,x,i)=>n+(ans[i]===x.a?1:0),0),wrong=ans.filter((a,i)=>a!==null&&a!==qs[i].a).length,skip=ans.filter(a=>a===null).length;let sec=qs.reduce((m,x,i)=>{m[x.si]=(m[x.si]||0)+(ans[i]===x.a?1:0);return m},{});let names=['बाल विकास एवं शिक्षाशास्त्र','गणित','पर्यावरण अध्ययन','संस्कृत (भाषा-I)','हिन्दी (भाषा-II)'];$("quiz").innerHTML='';$("result").classList.remove('hidden');$("result").innerHTML='<h2>'+(auto?'समय समाप्त':'Mock Test 5 Result')+'</h2><div class="score">'+score+' / 150</div><p><b>सही:</b> '+score+' &nbsp; <b>गलत:</b> '+wrong+' &nbsp; <b>छोड़े:</b> '+skip+'</p><h3>Section-wise Score</h3>'+names.map((n,i)=>'<p><b>'+n+'</b> — '+(sec[i]||0)+' / 30</p>').join('')+'<hr><h3>उत्तर समीक्षा</h3>'+qs.map((x,i)=>'<div class="reviewBox"><b>Q'+(i+1)+'. '+x.q+'</b><div class="'+(ans[i]===x.a?'correct':'wrong')+'">आपका उत्तर: '+(ans[i]===null?'नहीं दिया':x.o[ans[i]])+' | सही उत्तर: '+x.o[x.a]+'</div><div class="explain">सही विकल्प: '+x.o[x.a]+' — यह प्रश्न concept/application आधारित अभ्यास के लिए तैयार किया गया है।</div></div>').join('')+'<div class="actions"><button class="btn primary" onclick="location.reload()">फिर से प्रयास करें</button></div>';scrollTo(0,0)}function submitTest(){if(!submitted&&confirm("क्या आप टेस्ट सबमिट करना चाहते हैं?"))showResult(false)}function tick(){if(submitted)return;if(--time<=0){time=0;showResult(true)}let m=Math.floor(time/60),s=time%60;$("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}render();const clock=setInterval(tick,1000);</script></body></html>
