let cur=0,ans=Array(qs.length).fill(null),review=Array(qs.length).fill(false),submitted=false,time=150*60;
const $=id=>document.getElementById(id);
function render(){if(submitted)return;const x=qs[cur];$("quiz").innerHTML='<div class="section">'+x.sec+'</div><div class="qno">प्रश्न '+(cur+1)+' / '+qs.length+'</div><div class="question">'+x.q+'</div><div class="opts">'+x.o.map((o,i)=>'<label class="opt '+(ans[cur]===i?'sel':'')+'"><input type="radio" name="opt" '+(ans[cur]===i?'checked':'')+' onchange="choose('+i+')"><span><b>'+String.fromCharCode(65+i)+'.</b> '+o+'</span></label>').join('')+'</div><div class="actions"><button class="btn secondary" onclick="prev()">← पिछला</button><button class="btn warn" onclick="mark()">⚑ '+(review[cur]?'Review हटाएँ':'Mark for Review')+'</button><button class="btn secondary" onclick="clearAns()">उत्तर साफ करें</button><button class="btn primary" onclick="next()">'+(cur===qs.length-1?'अंतिम प्रश्न':'अगला →')+'</button></div>';updatePalette()}
function choose(i){ans[cur]=i;render()}function prev(){if(cur>0){cur--;render()}}function next(){if(cur<qs.length-1){cur++;render()}else submitTest()}function mark(){review[cur]=!review[cur];render()}function clearAns(){ans[cur]=null;render()}function gotoQ(i){if(!submitted){cur=i;render()}}
function updatePalette(){$("palette").innerHTML=qs.map((x,i)=>'<div class="p '+(ans[i]!==null?'answered ':'')+(review[i]?'review ':'')+(i===cur?'current':'')+'" onclick="gotoQ('+i+')">'+(i+1)+'</div>').join('');$("fill").style.width=(ans.filter(x=>x!==null).length/qs.length*100)+'%'}
function showResult(auto=false){if(submitted)return;submitted=true;clearInterval(clock);let score=qs.reduce((n,x,i)=>n+(ans[i]===x.a?1:0),0),wrong=ans.filter((a,i)=>a!==null&&a!==qs[i].a).length,skip=ans.filter(a=>a===null).length;let by=S.map((s,si)=>{let c=qs.reduce((n,x,i)=>n+(x.si===si&&ans[i]===x.a?1:0),0);return '<p><b>'+s.n+'</b> — '+c+' / '+s.qs.length+'</p>'}).join('');$("quiz").innerHTML='';$("result").classList.remove('hidden');$("result").innerHTML='<h2>'+(auto?'समय समाप्त':'Mock Test 4 Result')+'</h2><div class="score">'+score+' / 150</div><p><b>सही:</b> '+score+' &nbsp; <b>गलत:</b> '+wrong+' &nbsp; <b>छोड़े:</b> '+skip+'</p><h3>Section-wise Score</h3>'+by+'<hr><h3>उत्तर समीक्षा</h3>'+qs.map((x,i)=>'<div class="reviewBox"><b>Q'+(i+1)+'. '+x.q+'</b><div class="'+(ans[i]===x.a?'correct':'wrong')+'">आपका उत्तर: '+(ans[i]===null?'नहीं दिया':x.o[ans[i]])+' | सही उत्तर: '+x.o[x.a]+'</div><div class="explain">'+x.e+'</div></div>').join('')+'<div class="actions"><button class="btn primary" onclick="location.reload()">फिर से प्रयास करें</button></div>';window.scrollTo(0,0)}
function submitTest(){if(submitted)return;if(!confirm("क्या आप टेस्ट सबमिट करना चाहते हैं?"))return;showResult(false)}
function tick(){if(submitted)return;time--;if(time<=0){time=0;showResult(true)}let m=Math.floor(time/60),s=time%60;$("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
render();const clock=setInterval(tick,1000);
