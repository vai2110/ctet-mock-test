function jump(i){idx=i;render();window.scrollTo({top:0,behavior:"smooth"});}

function tick(){if(submitted)return;time--;if(time<=0){time=0;document.getElementById("timer").textContent="00:00";submitTest();return;}let m=Math.floor(time/60),s=time%60;document.getElementById("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
const palette=document.getElementById("palette");raw.forEach((_,i)=>{let b=document.createElement("button");b.className="p";b.textContent=i+1;b.onclick=()=>jump(i);palette.appendChild(b);});
