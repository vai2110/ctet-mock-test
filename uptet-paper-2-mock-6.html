<script>
const Q=[{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"एक विद्यार्थी किसी नियम को नए उदाहरण पर लागू कर पाता है, पर नियम की व्याख्या नहीं कर पाता। शिक्षक को पहले क्या जाँचना चाहिए?","o":["केवल लिखावट","बैठने की स्थिति","गृहकार्य की मात्रा","नियम की वैचारिक समझ"],"a":3},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"कक्षा में विद्यार्थी अपनी गलती पहचानकर समाधान बदलता है। यह किसका संकेत है?","o":["निष्क्रिय ग्रहण","स्व-निगरानी","बाह्य नियंत्रण","अनुकरण मात्र"],"a":1},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"बाल विकास के संदर्भ में 'विकास की गति में व्यक्तिगत भिन्नता' का अर्थ है—","o":["विकास केवल आयु पर निर्भर है","सभी भिन्नताएँ स्थायी अक्षमता हैं","सभी बच्चे समान क्रम में अलग गति से प्रगति कर सकते हैं","हर बच्चा एक ही दिन समान कौशल सीखता है"],"a":2},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"एक शिक्षक समूह-कार्य के बाद हर विद्यार्थी से अलग-अलग चिंतन-पत्र लिखवाता है। इससे मुख्यतः क्या सुनिश्चित होता है?","o":["व्यक्तिगत समझ का प्रमाण","समूह का अंक ही व्यक्तिगत उपलब्धि","केवल तेज लेखन का अभ्यास","सहयोग का निषेध"],"a":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"बालक किसी अवधारणा को ठोस वस्तुओं से समझता है, फिर चित्रों और अंत में प्रतीकों से। यह किस प्रकार की योजना है?","o":["केवल रटने पर आधारित शिक्षण","मूल्यांकन हटाना","ठोस से अमूर्त की ओर बढ़ना","अमूर्त से ठोस की ओर अनिवार्य बढ़ना"],"a":2},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"एक विद्यार्थी बार-बार असफल होने के बाद प्रयास छोड़ देता है। शिक्षक का सबसे उपयुक्त कदम क्या है?","o":["उसे आलसी घोषित करना","उसे चुनौती से हमेशा दूर रखना","दूसरों से तुलना करना","छोटे प्राप्त करने योग्य लक्ष्य और उपयोगी प्रतिक्रिया देना"],"a":3},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"किस उदाहरण में अधिगम का स्थानांतरण सकारात्मक है?","o":["भिन्नों का ज्ञान अनुपात समझने में मदद करे","पुरानी गलत धारणा नई समस्या बिगाड़े","विद्यार्थी सीखा हुआ भूल जाए","एक विषय का ज्ञान दूसरे में बाधा बने"],"a":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"प्रतिभाशाली विद्यार्थी को सार्थक चुनौती देने का बेहतर तरीका क्या है?","o":["उसे पाठ document.getElementById("fill").style.width=(answers.filter(x=>x!==null).length/Q.length*100)+"%";}
function pick(j){answers[idx]=j;render()}function next(){if(idx<Q.length-1){idx++;render();window.scrollTo({top:0,behavior:"smooth"})}}function prev(){if(idx>0){idx--;render();window.scrollTo({top:0,behavior:"smooth"})}}function clearAns(){answers[idx]=null;render()}function jump(i){idx=i;render();window.scrollTo({top:0,behavior:"smooth"})}
function submitTest(){if(submitted)return;if(time>0&&!confirm("क्या आप टेस्ट सबमिट करना चाहते हैं?"))return;submitted=true;clearInterval(clock);const score=answers.reduce((n,a,i)=>n+(a===Q[i].a?1:0),0),attempted=answers.filter(x=>x!==null).length,pct=(score/Q.length*100).toFixed(2);
document.getElementById("result").classList.remove("hidden");document.getElementById("quiz").classList.add("hidden");
document.getElementById("result").innerHTML=`<h2>आपका परिणाम</h2><div class="score">${score} / ${Q.length}</div><p><b>प्रतिशत:</b> ${pct}% &nbsp; | &nbsp; <b>प्रयास किए:</b> ${attempted}/150 &nbsp; | &nbsp; <b>छोड़े:</b> ${150-attempted}</p><hr><h3>विषयवार प्रदर्शन</h3>${["बाल विकास एवं शिक्षाशास्त्र","हिन्दी भाषा-प्रथम","संस्कृत भाषा-द्वितीय","गणित","विज्ञान"].map(s=>{const ids=Q.map((x,i)=>x.section===s?i:-1).filter(i=>i>=0),sc=ids.filter(i=>answers[i]===Q[i].a).length;return `<span class="tag">${s}: ${sc}/${ids.length}</span>`}).join("")}<h3>उत्तर-कुंजी और समीक्षा</h3>${Q.map((x,i)=>`<div class="reviewBox"><b>प्रश्न ${i+1}. ${esc(x.q)}</b><br>आपका उत्तर: ${answers[i]===null?"उत्तर नहीं दिया":esc(x.o[answers[i]])}<br><span class="${answers[i]===x.a?'correct':'wrong'}">सही उत्तर: ${esc(x.o[x.a])} ${answers[i]===x.a?'✓':'✗'}</span></div>`).join("")}` ;
document.getElementById("result").scrollIntoView({behavior:"smooth"});}
function tick(){if(submitted)return;time--;if(time<=0){time=0;document.getElementById("timer").textContent="00:00";submitTest();return;}document.getElementById("timer").textContent=String(Math.floor(time/60)).padStart(2,"0")+":"+String(time%60).padStart(2,"0")}
const palette=document.getElementById("palette");Q.forEach((_,i)=>{const b=document.createElement("button");b.className="p";b.textContent=i+1;b.onclick=()=>jump(i);palette.appendChild(b)});const clock=setInterval(tick,1000);render();
</script></body></html>
